[workspace]
name = "rna-gc-bias-metrics"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64"]
preview = ["pixi-build"]

# Runtime deps from conda-forge / bioconda.
[dependencies]
python = ">=3.12"
numpy = ">=2.3.2"
polars = ">=1.37.1"

# rna-gc-bias-metrics installs editable via uv. polars-bio is PyPI-only, so it
# lives here rather than in [dependencies].
[pypi-dependencies]
rna-gc-bias-metrics = { path = ".", editable = true }
# <0.35: 0.35.0 fails to coerce load_bam's `(flags & 2308) == 0` mask
# (DataFusion "UInt32 AND Int64").
polars-bio = ">=0.31,<0.35"

[feature.dev.dependencies]
pytest = ">=9.0"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[feature.dev.tasks]
test = "pytest test/ -v"
