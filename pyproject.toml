[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "rna-gc-bias-metrics"
version = "0.4.0"
description = "A tool to calculate the GC bias profile of RNAseq data."
authors = [{name = "Gautam Naishadham"}]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.2",
    "polars>=1.37.1",
    # <0.35: 0.35.0 fails to coerce load_bam's `(flags & 2308) == 0` mask
    # (DataFusion "UInt32 AND Int64").
    "polars-bio>=0.31,<0.35",
]

[project.urls]
Homepage = "https://github.com/nebiolabs/rna-gc-bias-metrics"
Source = "https://github.com/nebiolabs/rna-gc-bias-metrics"
Issues = "https://github.com/nebiolabs/rna-gc-bias-metrics/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
